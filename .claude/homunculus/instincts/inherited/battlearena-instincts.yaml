# Battlearena Workflow Multi Package Dependency Upgrade

## Action

Follow the multi-package-dependency-upgrade workflow:
1. Identify outdated dependencies in each package.json across all project directories.
2. Update the version numbers in package.json and package-lock.json for each affected package.
3. Commit all updated package.json and package-lock.json files in a single commit.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: */package.json, */package-lock.json, */*/package.json

