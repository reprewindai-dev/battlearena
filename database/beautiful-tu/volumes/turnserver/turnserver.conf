# Coturn TURN server configuration
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# Authentication
use-auth-secret
static-auth-secret=battlearena-turn-secret
realm=battlearena

# TURN configuration
total-quota=100
user-quota=12
max-bps=64000
bps-capacity-flags=0

# Logging
log-file=/var/log/turnserver.log
verbose

# STUN/TURN server
server-name=battlearena
no-tcp
no-tls-v1
no-tls-v1-1
no-tls-v1-2

# UDP relay ports
min-port=49152
max-port=65535
