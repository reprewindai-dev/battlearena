version: '3.8'

services:
  # Supabase Studio
  studio:
    image: public.ecr.aws/supabase/studio:20240304-a7c85589
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - SUPABASE_URL=http://kong:8000
      - SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOqeVoXb5BTf1LhV9cV3IMDzJ9jmfH4KqN5c
      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35LJzJbYUBtJIA07CagfkyNfn2pAmqK5M
    depends_on:
      - kong

  # Kong API Gateway
  kong:
    image: kong:3.4
    restart: unless-stopped
    ports:
      - '8000:8000'
      - '8443:8443'
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./volumes/api/kong.yml:/kong/declarative/kong.yml
      - ./volumes/logs/kong:/var/log/kong
    depends_on:
      - auth

  # Supabase Auth
  auth:
    image: public.ecr.aws/supabase/gotrue:v2.91.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - GOTRUE_API_HOST=0.0.0.0
      - GOTRUE_API_PORT=9999
      - GOTRUE_DB_DRIVER=postgres
      - GOTRUE_DB_DATABASE_URL=postgresql://supabase_auth:postgres@db:5432/postgres
      - GOTRUE_SITE_URL=http://localhost:3000
      - GOTRUE_URI_ALLOW_LIST=*
      - GOTRUE_DISABLE_SIGNUP=false
      - GOTRUE_JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - GOTRUE_JWT_EXP=3600
      - GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated
      - GOTRUE_EXTERNAL_EMAIL_ENABLED=true
      - GOTRUE_MAILER_AUTOCONFIRM=true
      - GOTRUE_SMTP_HOST=mailhog
      - GOTRUE_SMTP_PORT=1025
      - GOTRUE_SMTP_USER=postmaster@mailhog
      - GOTRUE_SMTP_PASS=emailpassword
      - GOTRUE_SMTP_ADMIN_EMAIL=postmaster@mailhog
      - GOTRUE_MAILER_URLPATHS_CONFIRMATION=/auth/v1/verify
      - GOTRUE_MAILER_URLPATHS_RECOVERY=/auth/v1/recover
      - GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE=/auth/v1/email_change

  # Supabase REST API
  rest:
    image: postgrest/postgrest:v12.0.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PGRST_DB_URI=postgresql://postgres:postgres@db:5432/postgres
      - PGRST_DB_SCHEMAS=public,storage
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - PGRST_DB_MAX_ROWS=1000
      - PGRST_DB_PREPARED_STATEMENTS=true

  # Supabase Realtime
  realtime:
    image: public.ecr.aws/supabase/realtime:v2.25.73
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PORT=4000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_AFTER_CONNECT_QUERY=SET search_path TO _realtime
      - DB_ENC_KEY=supabaserealtimeprotectthissecret
      - API_JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - API_EXTERNAL_URL=http://localhost:3000
      - FLY_ALLOC_ID=fake-alloc-id
      - FLY_APP_NAME=fake-app-name
      - FLY_REGION=fake-region

  # Supabase Storage
  storage:
    image: public.ecr.aws/supabase/storage:v0.48.0
    restart: unless-stopped
    depends_on:
      rest:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      - ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOqeVoXb5BTf1LhV9cV3IMDzJ9jmfH4KqN5c
      - SERVICE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35LJzJbYUBtJIA07CagfkyNfn2pAmqK5M
      - POSTGREST_URL=http://rest:3000
      - PGRST_JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
      - FILE_SIZE_LIMIT=52428800
      - STORAGE_BACKEND=file
      - STORAGE_FILE_PATH=/var/lib/storage
      - TENANT_ID=local
      - REGION=local
      - ENABLE_IMAGE_TRANSFORMATION=true
      - IMAGE_TRANSFORMATION_SERVICE=http://imgproxy:5001
    volumes:
      - ./volumes/storage:/var/lib/storage

  # Imgproxy for image transformations
  imgproxy:
    image: darthsim/imgproxy:v3.8.0
    restart: unless-stopped
    environment:
      - IMGPROXY_BIND=:5001
      - IMGPROXY_LOCAL_FILESYSTEM_ROOT=/var/lib/storage
      - IMGPROXY_USE_ETAG=true
      - IMGPROXY_ENABLE_WEBP_DETECTION=true
    volumes:
      - ./volumes/storage:/var/lib/storage

  # Database
  db:
    image: public.ecr.aws/supabase/postgres:15.1.0.187
    restart: unless-stopped
    ports:
      - '54322:5432'
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_INITDB_ARGS=--auth-host=scram
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - ./volumes/db/init:/docker-entrypoint-initdb.d
      - ./volumes/db/data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U postgres -h localhost
      interval: 5s
      timeout: 5s
      retries: 10

  # MailHog for email testing
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  db_data:
    driver: local
