name: Battle Arena E2E

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "e2e/**"
      - "*.ts"
      - "*.mts"
      - "*.mjs"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - ".github/workflows/arena-web-e2e.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "src/**"
      - "public/**"
      - "e2e/**"
      - "*.ts"
      - "*.mts"
      - "*.mjs"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - ".github/workflows/arena-web-e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      PORT: 3100

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: E2E
        run: npm run test:e2e
