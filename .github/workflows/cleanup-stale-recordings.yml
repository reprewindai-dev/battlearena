name: Cleanup stale battle recordings

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Call cleanup endpoint
        env:
          CLEANUP_URL: ${{ secrets.CLEANUP_URL }}
          CRON_CLEANUP_SECRET: ${{ secrets.CRON_CLEANUP_SECRET }}
        run: |
          if [ -z "$CLEANUP_URL" ]; then
            echo "CLEANUP_URL secret is required"
            exit 1
          fi
          if [ -z "$CRON_CLEANUP_SECRET" ]; then
            echo "CRON_CLEANUP_SECRET secret is required"
            exit 1
          fi

          curl -sS -X POST "$CLEANUP_URL" \
            -H "x-cron-secret: $CRON_CLEANUP_SECRET" \
            -H "content-type: application/json" \
            --data '{}' \
            --fail
